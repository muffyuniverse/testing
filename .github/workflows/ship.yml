name: ship

# The rule this workflow exists to keep: code is committed, binaries are not.
#   build  -> create the release, zip app/ into dist/, bake build.json, upload the zip as an asset
#   deploy -> download that asset *from the release*, publish it to Pages, and mirror the same
#             files to the `site` branch so a CDN can serve them where github.io cannot be reached
#   apk    -> download the same asset again, put it in the Android app's assets, build a
#             debug APK, attach the APK to the same release
# dist/, *.zip and *.apk are in .gitignore, so a clone contains no build output at all.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ship
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, so the snapshot baked below can name this very release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" \
              --notes "Built from ${GITHUB_SHA}. Code lives here; every binary is an asset of this release."

      - name: Build the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R app/. dist/

          # A snapshot the page can render without calling the API at all:
          # api.github.com answers 403 to rate-limited and datacentre networks.
          gh api "repos/$GITHUB_REPOSITORY" > repo.json
          gh api "repos/$GITHUB_REPOSITORY/commits?per_page=1" > commits.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=3" > runs.json || echo '{"workflow_runs":[]}' > runs.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" > releases.json || echo '[]' > releases.json

          python3 - <<'PY'
          import datetime, json, os

          repo = json.load(open("repo.json"))
          commits = json.load(open("commits.json")) or [{}]
          runs = json.load(open("runs.json")).get("workflow_runs", [])[:3]
          releases = json.load(open("releases.json")) or [{}]

          head = commits[0] or {}
          commit = head.get("commit") or {}
          author = commit.get("author") or {}
          release = releases[0] or {}

          meta = {
              "tag": os.environ["TAG"],
              "sha": os.environ["GITHUB_SHA"],
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "snapshot": {
                  "repo": {
                      "full_name": repo.get("full_name"),
                      "html_url": repo.get("html_url"),
                      "default_branch": repo.get("default_branch"),
                      "visibility": repo.get("visibility"),
                      "license": (repo.get("license") or {}).get("spdx_id"),
                      "open_issues": repo.get("open_issues_count"),
                  },
                  "head": {
                      "message": (commit.get("message") or "").split("\n")[0],
                      "sha": head.get("sha"),
                      "author": author.get("name"),
                      "date": author.get("date"),
                  },
                  "release": {
                      "tag": release.get("tag_name"),
                      "url": release.get("html_url"),
                      "assets": len(release.get("assets") or []),
                      "published_at": release.get("published_at"),
                  },
                  "runs": [
                      {
                          "name": r.get("name"),
                          "conclusion": r.get("conclusion"),
                          "status": r.get("status"),
                          "sha": r.get("head_sha"),
                          "created_at": r.get("created_at"),
                          "url": r.get("html_url"),
                      }
                      for r in runs
                  ],
              },
          }
          with open("dist/build.json", "w") as fh:
              json.dump(meta, fh, indent=2)
              fh.write("\n")
          PY

          ( cd dist && zip -qr "../app-${TAG}.zip" . )
          ls -lh "app-${TAG}.zip"

      - name: Publish the asset, not the file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "app-${TAG}.zip" --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Fetch the asset back out of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern 'app-*.zip' --dir .
          mkdir -p _site
          unzip -q "app-${TAG}.zip" -d _site
          echo "--- build.json inside the shipped asset ---"
          cat _site/build.json

      - name: Mirror the same files to the site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _site
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "site: ${TAG} from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          echo "mirrored to $(git rev-parse --short HEAD) on branch site"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put the shipped bundle inside the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern 'app-*.zip' --dir .
          mkdir -p android/app/src/main/assets/www
          unzip -q "app-${TAG}.zip" -d android/app/src/main/assets/www
          ls -1 android/app/src/main/assets/www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build the debug APK
        run: |
          set -euo pipefail
          gradle -p android assembleDebug --no-daemon -PversionName="${TAG}"
          ls -lh android/app/build/outputs/apk/debug/

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "factory-${TAG}-debug.apk"
          gh release upload "$TAG" "factory-${TAG}-debug.apk" --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
