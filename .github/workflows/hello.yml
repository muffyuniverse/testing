name: hello

# Two ways in: a push to main (what the app's own `push` does) and a manual dispatch
# (POST /repos/{owner}/{repo}/actions/workflows/hello.yml/dispatches, needs a token).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Say hello
        run: |
          echo "commit:  $GITHUB_SHA"
          echo "event:   $GITHUB_EVENT_NAME"
          echo "actor:   $GITHUB_ACTOR"
          echo "repo:    $GITHUB_REPOSITORY"
      - name: List the request forms
        run: |
          echo "forms in requests/:"
          ls -1 requests/
