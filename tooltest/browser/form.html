<!doctype html>
<html>
<head><meta charset="utf-8"><title>Form test</title>
<style>
 body { font-family: sans-serif; padding: 16px; }
 #list div { padding: 2px 0; }
 .done { color: green; }
</style>
</head>
<body>
<h1>Item list</h1>
<label for="name">Name</label>
<input id="name" placeholder="type a name">
<button id="add">Add</button>
<button id="clear">Clear</button>
<p>Count: <span id="count">0</span></p>
<div id="list"></div>
<script>
  const input = document.getElementById('name');
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  function refresh() { count.textContent = list.children.length; }
  document.getElementById('add').onclick = () => {
    const v = input.value.trim();
    if (!v) return;
    const d = document.createElement('div');
    d.textContent = v;
    d.onclick = () => d.classList.toggle('done');
    list.appendChild(d);
    input.value = '';
    refresh();
  };
  document.getElementById('clear').onclick = () => { list.innerHTML = ''; refresh(); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('add').click(); });
</script>
</body>
</html>
